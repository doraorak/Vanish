<svg id="vanish-app-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
          <defs>
            <!-- Canvas background: soft cool gray gradient -->
            <linearGradient id="vanish-bg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#F5F5F7"/>
              <stop offset="100%" stop-color="#DDDCE1"/>
            </linearGradient>

            <!-- Fine grid overlay -->
            <pattern id="vanish-grid" width="32" height="32" patternUnits="userSpaceOnUse">
              <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(0, 0, 0, 0.035)" stroke-width="1"/>
            </pattern>

            <!-- Soft ambient red glow behind the button -->
            <radialGradient id="vanish-soft-glow" cx="50%" cy="50%" r="55%">
              <stop offset="0%" stop-color="#FF5F56" stop-opacity="0.22"/>
              <stop offset="55%" stop-color="#FF5F56" stop-opacity="0.05"/>
              <stop offset="100%" stop-color="#FF5F56" stop-opacity="0"/>
            </radialGradient>

            <!-- Red button 3D gradient (bright top-left → deep bottom-right) -->
            <radialGradient id="vanish-button" cx="35%" cy="30%" r="80%">
              <stop offset="0%" stop-color="#FF9188"/>
              <stop offset="55%" stop-color="#FF5F56"/>
              <stop offset="100%" stop-color="#C22B22"/>
            </radialGradient>

            <!-- Warm red shadow beneath the button -->
            <filter id="vanish-btn-shadow" x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#B31E15" flood-opacity="0.35"/>
            </filter>

            <!-- Bright bloom on the innermost vanish dot -->
            <radialGradient id="vanish-dot-bloom" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
              <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <!-- Base canvas + grid -->
          <rect width="512" height="512" fill="url(#vanish-bg)"/>
          <rect width="512" height="512" fill="url(#vanish-grid)"/>

          <!-- Soft ambient glow (large, diffuse) -->
          <circle cx="256" cy="256" r="256" fill="url(#vanish-soft-glow)"/>

          <!-- Concentric shrink-echo rings (outermost = faintest, "earlier animation frame") -->
          <circle cx="256" cy="256" r="228" fill="none" stroke="#FF5F56" stroke-width="1.25" stroke-dasharray="2 6" opacity="0.18"/>
          <circle cx="256" cy="256" r="192" fill="none" stroke="#FF5F56" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.28"/>
          <circle cx="256" cy="256" r="158" fill="none" stroke="#FF5F56" stroke-width="1.75" stroke-dasharray="4 4" opacity="0.42"/>

          <!-- Main red close-button -->
          <g filter="url(#vanish-btn-shadow)">
            <circle cx="256" cy="256" r="118" fill="url(#vanish-button)"/>
            <!-- Rim highlight (thin white stroke, top arc emphasized via clip-less approach) -->
            <circle cx="256" cy="256" r="118" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>
            <!-- Glossy top-left highlight -->
            <ellipse cx="226" cy="212" rx="60" ry="28" fill="rgba(255,255,255,0.32)" transform="rotate(-28 226 212)"/>
          </g>

          <!-- Center vanish-point dot: bright bloom + solid core -->
          <circle cx="256" cy="256" r="26" fill="url(#vanish-dot-bloom)"/>
          <circle cx="256" cy="256" r="7" fill="#FFFFFF"/>
        </svg>